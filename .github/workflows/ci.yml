name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install from wheel build
        run: python -m pip install '.[test]'
      - name: Unit and independent-oracle tests
        run: python -m pytest -W error
      - name: Run complete reproducible example
        run: queue-window-audit --output /tmp/queue-audit-results
      - name: Check dependency consistency
        run: python -m pip check
